<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How DynamoDB Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url("node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }

  :root {
    --bg: #0a0f1e;
    --panel: #111a31;
    --panel-raised: #17223f;
    --line: #26345a;
    --text: #eef2fb;
    --muted: #8e9aba;
    --blue: #5b84ff;
    --blue-soft: rgba(91, 132, 255, 0.16);
    --violet: #a27bff;
    --violet-soft: rgba(162, 123, 255, 0.16);
    --green: #3ddc97;
    --green-soft: rgba(61, 220, 151, 0.14);
    --red: #ff6b81;
    --red-soft: rgba(255, 107, 129, 0.16);
    --gold: #ffc53d;
    --gold-soft: rgba(255, 197, 61, 0.16);
    --cyan: #3fd5f0;
    --orange: #ff9f43;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body { font-family: "Inter", "Noto Color Emoji", sans-serif; color: var(--text); }

  #stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
    transform-origin: 0 0;
    background:
      radial-gradient(circle at 18% 12%, rgba(91, 132, 255, 0.16), transparent 42%),
      radial-gradient(circle at 85% 88%, rgba(162, 123, 255, 0.13), transparent 45%),
      var(--bg);
  }
  #stage::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px);
    background-size: 40px 40px;
  }

  .scene { position: absolute; inset: 0; display: none; }
  .overlay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .abs { position: absolute; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .muted { color: var(--muted); }

  .card {
    position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }
  .card-title { font-size: 34px; font-weight: 800; letter-spacing: -0.01em; }
  .chip {
    display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px;
    font-weight: 700; font-size: 30px; white-space: nowrap;
  }
  .tag {
    position: absolute; padding: 8px 18px; border-radius: 12px; font-size: 26px; font-weight: 700; white-space: nowrap;
  }
  .badge-pk { background: var(--blue-soft); color: var(--blue); border: 2px solid var(--blue); }
  .badge-sk { background: var(--violet-soft); color: var(--violet); border: 2px solid var(--violet); }
  .good { background: var(--green-soft); color: var(--green); border: 2px solid var(--green); }
  .bad { background: var(--red-soft); color: var(--red); border: 2px solid var(--red); }
  .warn { background: var(--gold-soft); color: var(--gold); border: 2px solid var(--gold); }
  .info { background: var(--blue-soft); color: var(--blue); border: 2px solid var(--blue); }

  /* Chrome shared by every scene */
  #scene-label { position: absolute; left: 80px; top: 52px; display: flex; align-items: baseline; gap: 20px; }
  #scene-number { font-family: "JetBrains Mono", monospace; font-size: 26px; color: var(--blue); font-weight: 600; }
  #scene-title { font-size: 30px; font-weight: 700; color: var(--text); }
  #progress { position: absolute; left: 0; top: 0; width: 1920px; height: 8px; display: flex; gap: 4px; }
  .progress-segment { height: 100%; flex-grow: 1; background: rgba(255, 255, 255, 0.08); position: relative; overflow: hidden; }
  .progress-fill { position: absolute; inset: 0; background: linear-gradient(90deg, var(--blue), var(--violet)); transform-origin: 0 0; }
  #brand { position: absolute; right: 80px; top: 50px; font-size: 24px; font-weight: 700; color: var(--muted); display: flex; gap: 12px; align-items: center; }

  #captions {
    position: absolute; left: 160px; width: 1600px; top: 922px; text-align: center;
    font-size: 44px; font-weight: 700; line-height: 1.25; letter-spacing: -0.005em;
  }
  #captions .caption-box {
    display: inline-block; padding: 14px 32px; border-radius: 18px; background: rgba(5, 8, 18, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  #captions .word { color: rgba(238, 242, 251, 0.55); }
  #captions .word.spoken { color: var(--text); }
  #captions .word.current { color: var(--gold); }

  /* Scene-specific pieces */
  .big-number { font-size: 168px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .title-big { font-size: 150px; font-weight: 800; letter-spacing: -0.04em; }
  .row-line { display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 600; height: 76px; position: relative; }
  .strike { position: absolute; left: 74px; top: 38px; height: 5px; background: var(--red); border-radius: 3px; transform-origin: 0 50%; }
  .mini-grid { position: absolute; display: grid; gap: 4px; }
  .mini-grid div { background: var(--panel-raised); border-radius: 6px; height: 34px; font-size: 18px; color: var(--muted); display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; }
  .mini-grid .head { background: rgba(91, 132, 255, 0.25); color: var(--text); font-weight: 600; }
  .item-card { position: absolute; background: var(--panel-raised); border: 2px solid var(--line); border-radius: 20px; padding: 22px 26px; }
  .attribute { display: flex; gap: 16px; font-size: 26px; padding: 9px 12px; border-radius: 10px; border: 2px solid transparent; }
  .attribute .name { font-family: "JetBrains Mono", monospace; color: var(--muted); min-width: 170px; }
  .attribute .value { font-family: "JetBrains Mono", monospace; color: var(--text); }
  .sheet { position: absolute; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .sheet div { height: 44px; background: var(--panel-raised); border-radius: 6px; font-family: "JetBrains Mono", monospace; font-size: 20px; display: flex; align-items: center; padding: 0 12px; color: var(--text); }
  .sheet .head { background: rgba(255, 255, 255, 0.1); font-weight: 600; color: var(--muted); }
  .sheet .empty { color: var(--red); justify-content: center; }
  .table-row { position: absolute; left: 0; width: 1200px; height: 58px; display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; border-radius: 12px; font-family: "JetBrains Mono", monospace; font-size: 28px; padding: 0 28px; }
  .server { position: absolute; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; }
  .server-head { font-size: 28px; font-weight: 800; padding: 18px 22px 8px; }
  .server-lights { position: absolute; right: 22px; top: 26px; display: flex; gap: 8px; }
  .server-lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--green); display: block; }
  .slots { position: absolute; left: 22px; right: 22px; bottom: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slots div { height: 34px; border-radius: 8px; background: var(--panel-raised); font-family: "JetBrains Mono", monospace; font-size: 18px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .tile { position: absolute; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: rgba(255, 255, 255, 0.9); font-family: "JetBrains Mono", monospace; }
  .dot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; }
  .meter { position: absolute; left: 22px; right: 22px; bottom: 22px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 13px; }
  .bullet { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 600; }
  .use-tile { position: absolute; width: 330px; height: 150px; border-radius: 20px; background: var(--panel-raised); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 28px; font-weight: 700; }
  .use-tile .emoji { font-size: 54px; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="progress"></div>
  <div id="scene-label"><span id="scene-number"></span><span id="scene-title"></span></div>
  <div id="brand"></div>
  <div id="captions"></div>
</div>

<script src="build/timeline.js"></script>
<script>
// ---------------------------------------------------------------------------
// Animation helpers. Every frame is drawn from the current time alone, so the
// renderer can jump to any moment and get the exact same picture every time.
// ---------------------------------------------------------------------------
const clamp01 = (value) => Math.max(0, Math.min(1, value));
const lerp = (from, to, progress) => from + (to - from) * progress;
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeOutBack = (x) => { const overshoot = 1.70158; return 1 + (overshoot + 1) * Math.pow(x - 1, 3) + overshoot * Math.pow(x - 1, 2); };

/** 0 before `start`, 1 after `start + duration`, smooth in between. */
function ramp(time, start, duration = 0.5, easing = easeInOut) {
  if (duration <= 0) return time >= start ? 1 : 0;
  return easing(clamp01((time - start) / duration));
}
/** A single smooth bump from 0 up to 1 and back to 0 over `duration`. */
function pulse(time, start, duration = 1) {
  const progress = (time - start) / duration;
  return progress <= 0 || progress >= 1 ? 0 : Math.sin(Math.PI * progress);
}
/** Fade an element in while sliding it up into place (optionally growing from smaller). */
function reveal(element, progress, { rise = 26, scaleFrom = 1, extra = "" } = {}) {
  element.style.opacity = progress;
  element.style.visibility = progress <= 0.001 ? "hidden" : "visible";
  element.style.transform = `translateY(${(1 - progress) * rise}px) scale(${lerp(scaleFrom, 1, progress)}) ${extra}`;
}
/** Pop-in: like reveal but with a little overshoot, good for badges and checkmarks. */
function pop(element, time, start, duration = 0.5) {
  const progress = clamp01((time - start) / duration);
  element.style.opacity = clamp01(progress * 2);
  element.style.visibility = progress <= 0 ? "hidden" : "visible";
  element.style.transform = `scale(${progress <= 0 ? 0.6 : lerp(0.6, 1, easeOutBack(progress))})`;
}
const formatNumber = (value) => Math.round(value).toLocaleString("en-US");

const SVG_NAMESPACE = "http://www.w3.org/2000/svg";
/** An arrow that can be "drawn on" from 0 to 1, with a moving point helper for packets. */
function createArrow(svg, pathData, { color = "var(--blue)", width = 5, dashed = false } = {}) {
  const path = document.createElementNS(SVG_NAMESPACE, "path");
  path.setAttribute("d", pathData);
  path.style.fill = "none";
  path.style.stroke = color;
  path.style.strokeWidth = width;
  path.style.strokeLinecap = "round";
  svg.appendChild(path);
  const length = path.getTotalLength();
  const head = document.createElementNS(SVG_NAMESPACE, "polygon");
  head.setAttribute("points", "0,-12 24,0 0,12");
  head.style.fill = color;
  svg.appendChild(head);
  const tip = path.getPointAtLength(length);
  const nearTip = path.getPointAtLength(Math.max(0, length - 6));
  const angle = (Math.atan2(tip.y - nearTip.y, tip.x - nearTip.x) * 180) / Math.PI;
  head.setAttribute("transform", `translate(${tip.x},${tip.y}) rotate(${angle}) translate(-20,0)`);
  const dashPattern = dashed ? "14 14" : `${length} ${length}`;
  return {
    set(progress, opacity = 1) {
      if (dashed) {
        path.style.strokeDasharray = dashPattern;
        path.style.opacity = progress * opacity;
        head.style.opacity = progress * opacity;
        return;
      }
      path.style.strokeDasharray = dashPattern;
      path.style.strokeDashoffset = length * (1 - progress);
      path.style.opacity = progress > 0 ? opacity : 0;
      head.style.opacity = clamp01((progress - 0.85) / 0.15) * opacity;
    },
    pointAt(progress) { return path.getPointAtLength(length * clamp01(progress)); },
  };
}
function placeAt(element, point) { element.style.left = `${point.x}px`; element.style.top = `${point.y}px`; }

/** The DynamoDB-style logo: three stacked database discs with a lightning bolt. */
let databaseIconCount = 0;
function databaseIcon(size, color = "#5b84ff") {
  const gradientId = `disc-gradient-${databaseIconCount++}`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120">
    <defs><linearGradient id="${gradientId}" x1="0" x2="1"><stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="#a27bff"/></linearGradient></defs>
    <path d="M14 30 v60 c0 9 21 16 46 16 s46 -7 46 -16 v-60" fill="url(#${gradientId})" opacity="0.9"/>
    <ellipse cx="60" cy="30" rx="46" ry="16" fill="#9fb6ff"/>
    <path d="M14 50 c0 9 21 16 46 16 s46 -7 46 -16" fill="none" stroke="#0a0f1e" stroke-width="4" opacity="0.55"/>
    <path d="M14 70 c0 9 21 16 46 16 s46 -7 46 -16" fill="none" stroke="#0a0f1e" stroke-width="4" opacity="0.55"/>
    <path d="M66 38 L46 72 H60 L54 98 L78 60 H63 Z" fill="#ffc53d" stroke="#0a0f1e" stroke-width="3" stroke-linejoin="round"/>
  </svg>`;
}

/** Finds the moment a word (or phrase) is spoken in a scene. */
function createCueFinder(scene) {
  const keys = scene.words.map((word) => word.key);
  return function at(phrase, occurrence = 1) {
    const target = phrase.toLowerCase().replace(/[^a-z0-9]/g, "");
    let found = 0;
    for (let first = 0; first < keys.length; first++) {
      let combined = "";
      for (let last = first; last < keys.length && combined.length < target.length; last++) {
        combined += keys[last];
        if (combined === target) {
          found += 1;
          if (found === occurrence) return scene.words[first].start;
        }
      }
    }
    throw new Error(`Cue "${phrase}" #${occurrence} not found in scene "${scene.id}"`);
  };
}

// ---------------------------------------------------------------------------
// Scenes. Each one builds its pieces once, then returns an update(time, at)
// function. `time` is seconds since the scene began; `at("word")` is the
// moment that word is spoken, so animations land on the narration.
// ---------------------------------------------------------------------------
const SCENE_BUILDERS = {};

SCENE_BUILDERS.hook = (root) => {
  root.innerHTML = `
    <div class="abs chip warn" id="prime-chip" style="left:0;top:200px;width:auto">🛒 Prime Day</div>
    <div class="abs" id="counter-group" style="left:0;top:300px;width:1920px;text-align:center">
      <div class="big-number mono" id="request-counter">0</div>
      <div style="font-size:38px;font-weight:600" class="muted">requests per second at peak (Prime Day 2025)</div>
    </div>
    <div class="abs" id="speed-badge" style="left:0;width:1920px;top:640px;text-align:center">
      <span class="chip good" style="font-size:36px">⏱ most answered in a few milliseconds</span>
    </div>
    <div id="dots"></div>
    <div class="abs" id="title-group" style="left:0;top:220px;width:1920px;text-align:center">
      <div id="logo">${databaseIcon(230)}</div>
      <div class="title-big">DynamoDB</div>
      <div id="title-subtitle" style="font-size:44px;font-weight:600;margin-top:14px" class="muted">How it works, and when to use it</div>
    </div>`;
  const primeChip = root.querySelector("#prime-chip");
  primeChip.style.left = "820px";
  const counterGroup = root.querySelector("#counter-group");
  const requestCounter = root.querySelector("#request-counter");
  const speedBadge = root.querySelector("#speed-badge");
  const titleGroup = root.querySelector("#title-group");
  const titleSubtitle = root.querySelector("#title-subtitle");
  const dotsLayer = root.querySelector("#dots");
  const dotCount = 46;
  const dots = Array.from({ length: dotCount }, (_, index) => {
    const dot = document.createElement("div");
    dot.className = "dot";
    dot.style.background = ["var(--blue)", "var(--violet)", "var(--cyan)"][index % 3];
    dotsLayer.appendChild(dot);
    return dot;
  });

  return (time, at) => {
    const titleProgress = ramp(time, at("dynamodb") - 0.2, 0.7);
    reveal(primeChip, ramp(time, at("prime") - 0.3, 0.5) * (1 - titleProgress));
    reveal(counterGroup, ramp(time, at("systems"), 0.6) * (1 - titleProgress), { rise: 40 });
    requestCounter.textContent = formatNumber(151_000_000 * ramp(time, at("hundred") - 0.4, 2.2, easeOut));
    reveal(speedBadge, ramp(time, at("milliseconds") - 0.2, 0.5) * (1 - titleProgress));
    reveal(titleGroup, titleProgress, { rise: 60, scaleFrom: 0.85 });
    reveal(titleSubtitle, ramp(time, at("pulls") - 0.3, 0.6));

    // Requests fly in from the left and land on the counter.
    const streamStrength = ramp(time, at("systems"), 0.8) * (1 - ramp(time, at("dynamodb") - 0.4, 0.6));
    dots.forEach((dot, index) => {
      const lane = (index * 137) % 620;
      const travel = (time * 0.55 + index / dotCount) % 1;
      const startX = -40, startY = 140 + lane;
      const endX = 960 + ((index * 53) % 300) - 150, endY = 400;
      dot.style.left = `${lerp(startX, endX, easeInOut(travel))}px`;
      dot.style.top = `${lerp(startY, endY, easeInOut(travel))}px`;
      dot.style.opacity = streamStrength * Math.sin(Math.PI * travel) * 0.85;
    });
  };
};

SCENE_BUILDERS.what = (root) => {
  const chores = [
    ["🖥️", "Set up servers", "servers"],
    ["📦", "Install software", "software"],
    ["🩹", "Apply patches", "patches"],
  ];
  const yourJob = [["✅", "Create a table", "create"], ["✅", "Start saving data", "saving"]];
  root.innerHTML = `
    <div class="card" id="managed-card" style="left:140px;top:170px;width:740px;height:660px;padding:36px 40px">
      <div class="card-title">AWS runs it for you</div>
      <div class="muted" style="font-size:26px;margin:6px 0 22px">a fully managed service</div>
      ${chores.map(([icon, label], index) => `<div class="row-line chore" data-index="${index}"><span style="width:52px">${icon}</span><span>${label}</span><div class="strike" style="width:${label.length * 18 + 20}px"></div><span class="no-mark" style="margin-left:auto;color:var(--red);font-size:40px">✕</span></div>`).join("")}
      <div style="height:2px;background:var(--line);margin:18px 0"></div>
      <div class="muted" style="font-size:24px;margin-bottom:6px">your part:</div>
      ${yourJob.map(([icon, label]) => `<div class="row-line job"><span style="width:52px">${icon}</span><span>${label}</span></div>`).join("")}
    </div>
    <div class="card" id="sql-card" style="left:960px;top:170px;width:820px;height:310px;padding:28px 34px">
      <div class="card-title" style="font-size:30px">Traditional SQL database</div>
      <div class="mini-grid" style="left:34px;top:96px;width:330px;grid-template-columns:repeat(3,1fr)">
        <div class="head">id</div><div class="head">name</div><div class="head">city</div>
        <div>1</div><div>Ana</div><div>Lima</div><div>2</div><div>Ben</div><div>Oslo</div>
      </div>
      <div class="mini-grid" style="left:456px;top:96px;width:330px;grid-template-columns:repeat(3,1fr)">
        <div class="head">order</div><div class="head">cust</div><div class="head">total</div>
        <div>A1</div><div>1</div><div>$18</div><div>A2</div><div>2</div><div>$42</div>
      </div>
      <span class="tag bad" id="fixed-tag" style="left:34px;top:226px">fixed columns</span>
      <span class="tag bad" id="join-tag" style="left:500px;top:226px">table joins</span>
    </div>
    <div class="card" id="nosql-card" style="left:960px;top:520px;width:820px;height:310px;padding:28px 34px">
      <div class="card-title" style="font-size:30px">DynamoDB (NoSQL)</div>
      <div class="abs chip warn mono" id="key-chip" style="left:34px;top:130px;font-size:28px">🔑 C-101</div>
      <div class="item-card" id="found-item" style="left:420px;top:92px;width:360px;padding:16px 20px">
        <div class="attribute"><span class="name" style="min-width:110px">Name</span><span class="value">Ana</span></div>
        <div class="attribute"><span class="name" style="min-width:110px">City</span><span class="value">Lima</span></div>
        <div class="attribute"><span class="name" style="min-width:110px">Orders</span><span class="value">2</span></div>
      </div>
      <span class="tag good" id="instant-tag" style="left:34px;top:236px">⚡ found by key, instantly</span>
    </div>`;
  const svg = document.createElementNS(SVG_NAMESPACE, "svg");
  svg.setAttribute("class", "overlay");
  root.appendChild(svg);
  const joinArrow = createArrow(svg, "M1300 300 C 1340 250, 1380 250, 1420 300", { color: "var(--red)", width: 4 });
  const keyArrow = createArrow(svg, "M1222 674 L 1370 674", { color: "var(--gold)", width: 5 });

  const managedCard = root.querySelector("#managed-card");
  const choreRows = [...root.querySelectorAll(".chore")];
  const jobRows = [...root.querySelectorAll(".job")];
  const sqlCard = root.querySelector("#sql-card");
  const nosqlCard = root.querySelector("#nosql-card");
  const keyChip = root.querySelector("#key-chip");
  const foundItem = root.querySelector("#found-item");

  return (time, at) => {
    reveal(managedCard, ramp(time, 0.1, 0.6));
    choreRows.forEach((row, index) => {
      const word = chores[index][2];
      reveal(row, ramp(time, at("never") + index * 0.2, 0.4), { rise: 14 });
      const strikeProgress = ramp(time, at(word) + 0.15, 0.35);
      row.querySelector(".strike").style.transform = `scaleX(${strikeProgress})`;
      row.querySelector(".no-mark").style.opacity = strikeProgress;
      row.style.color = strikeProgress > 0.5 ? "var(--muted)" : "var(--text)";
    });
    jobRows.forEach((row, index) => reveal(row, ramp(time, at(yourJob[index][2]) - 0.1, 0.4), { rise: 14 }));

/** Shared drawing of a row of partition "servers" used in a few scenes. */
function buildServers(root, { count = 4, top = 590, height = 230, withMeters = false, label = (index) => `Partition ${index + 1}`, contents = () => [] } = {}) {
  const servers = [];
  for (let index = 0; index < count; index++) {
    const server = document.createElement("div");
    server.className = "server";
    server.style.left = `${180 + index * 400}px`;
    server.style.top = `${top}px`;
    server.style.width = "330px";
    server.style.height = `${height}px`;
    server.innerHTML = `<div class="server-head">${label(index)}</div><div class="server-lights"><i></i><i></i></div>
      ${withMeters ? `<div class="muted" style="position:absolute;left:22px;bottom:60px;font-size:22px;font-weight:600">load <span class="load-value mono">0%</span></div><div class="meter"><div class="meter-fill"></div></div>`
                   : `<div class="slots">${contents(index).map((text) => `<div>${text}</div>`).join("")}</div>`}`;
    root.appendChild(server);
    servers.push(server);
  }
  return servers;
}

SCENE_BUILDERS.scaling = (root) => {
  const gridArea = { left: 140, top: 170, width: 1120, height: 660 };
  const stageCounts = [4, 8, 16, 64];
  const maxTiles = stageCounts[stageCounts.length - 1];
  root.innerHTML = `
    <div id="tiles"></div>
    <div class="card" style="left:1340px;top:170px;width:440px;height:300px;padding:30px 34px">
      <div class="muted" style="font-size:26px;font-weight:700">ITEMS STORED</div>
      <div class="mono" id="item-count" style="font-size:54px;font-weight:600;margin-top:16px;color:var(--gold)">1,000</div>
      <div class="muted" style="font-size:26px;font-weight:700;margin-top:30px">PARTITIONS</div>
      <div class="mono" id="partition-count" style="font-size:44px;font-weight:600;margin-top:6px">4</div>
    </div>
    <div class="card" id="speed-card" style="left:1340px;top:510px;width:440px;height:320px;padding:30px 34px">
      <div class="muted" style="font-size:26px;font-weight:700">TYPICAL READ TIME</div>
      <div class="mono" style="font-size:70px;font-weight:600;margin-top:12px;color:var(--green)">≈ 5 ms</div>
      <div style="font-size:28px;font-weight:600;margin-top:16px">same at every size</div>
      <svg width="370" height="60" style="margin-top:14px"><path d="M0 40 L 370 40" stroke="var(--green)" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/></svg>
    </div>
    <span class="tag info" id="slice-tag" style="left:440px;top:120px">each partition = its own slice of the data</span>`;
  const tilesLayer = root.querySelector("#tiles");
  const tiles = Array.from({ length: maxTiles }, (_, index) => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tilesLayer.appendChild(tile);
    return tile;
  });
  /** Grid position of tile `index` when the area holds `count` tiles. */
  function tileRect(count, index) {
    const columns = Math.ceil(Math.sqrt((count * gridArea.width) / gridArea.height));
    const rows = Math.ceil(count / columns);
    const gap = count > 20 ? 10 : 18;
    const width = (gridArea.width - gap * (columns - 1)) / columns;
    const height = (gridArea.height - gap * (rows - 1)) / rows;
    return { left: gridArea.left + (index % columns) * (width + gap), top: gridArea.top + Math.floor(index / columns) * (height + gap), width, height };
  }
  const itemCountAtStage = [1e3, 1e6, 5e7, 1e9];

  return (time, at) => {
    const stageCues = [0, at("splits"), at("spreads"), at("billion") - 0.4];
    let stage = 0;
    stageCues.forEach((cue, index) => { if (index > 0 && time >= cue) stage = index; });
    const stageProgress = stage === 0 ? 1 : ramp(time, stageCues[stage], 0.9);
    const count = stageCounts[stage];
    const previousCount = stageCounts[Math.max(0, stage - 1)];
    const childrenPerParent = count / previousCount;
    const wave = pulse(time, at("single") - 0.3, 1.6);

    tiles.forEach((tile, index) => {
      if (index >= count) { tile.style.display = "none"; return; }
      tile.style.display = "flex";
      const target = tileRect(count, index);
      const origin = stage === 0 ? target : tileRect(previousCount, Math.floor(index / childrenPerParent));
      const left = lerp(origin.left, target.left, stageProgress);
      const top = lerp(origin.top, target.top, stageProgress);
      const width = lerp(origin.width, target.width, stageProgress);
      const height = lerp(origin.height, target.height, stageProgress);
      Object.assign(tile.style, { left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px` });
      const hue = 222 + ((index * 7) % 40);
      const flash = stage > 0 ? pulse(time, stageCues[stage], 0.9) : 0;
      const waveHere = pulse(time, at("single") - 0.3 + (index % 8) * 0.08, 1.0);
      tile.style.background = `hsl(${hue} 70% ${46 + 14 * flash + 14 * waveHere}%)`;

      tile.style.opacity = ramp(time, 0.1 + index * 0.08, 0.4);
    });
    const fromCount = itemCountAtStage[Math.max(0, stage - 1)], toCount = itemCountAtStage[stage];

    root.querySelector("#partition-count").textContent = count;

    speedCard.style.borderColor = Math.max(pulse(time, at("fast"), 1.4), wave) > 0.3 ? "var(--green)" : "var(--line)";
  };
};

  const writePacket = makePacket("var(--gold)");

      dot.style.margin = "-8px 0 0 -8px";
    });
  };
};

SCENE_BUILDERS.hot = (root) => {
  root.innerHTML = `
    <div class="card" id="key-card" style="left:560px;top:160px;width:800px;height:120px;display:flex;align-items:center;justify-content:center;gap:20px">
      <span style="font-size:30px;font-weight:700">Partition key =</span>

    </div>
    <div id="request-dots"></div>
    <span class="tag bad" id="hot-tag" style="left:560px;top:520px;font-size:30px">🔥 hot partition</span>
    <span class="tag bad" id="slow-tag" style="left:860px;top:520px;font-size:30px">⚠ requests get slowed down</span>
    <span class="tag good" id="even-tag" style="left:1380px;top:200px;font-size:30px">✓ load spreads out evenly</span>`;
  const servers = buildServers(root, { top: 590, height: 230, withMeters: true });
  const idleLabels = servers.map((server, index) => {
    const label = document.createElement("div");
    label.className = "abs muted";
    label.style.cssText = `left:${parseFloat(server.style.left)}px;top:${parseFloat(server.style.top) + 80}px;width:330px;text-align:center;font-size:30px;font-weight:700`;
    label.textContent = index === 1 ? "" : "💤 idle";
    root.appendChild(label);
    return label;
  });
  const dotsLayer = root.querySelector("#request-dots");
  const dotCount = 36;
  const makeDots = (color) => Array.from({ length: dotCount }, () => { const dot = document.createElement("div"); dot.className = "dot"; dot.style.background = color; dotsLayer.appendChild(dot); return dot; });
  const crowdedDots = makeDots("var(--red)");
  const spreadDots = makeDots("var(--green)");
  const partitionCenterX = (index) => 180 + index * 400 + 165;

  function moveDots(dots, time, strength, targetFor) {
    dots.forEach((dot, index) => {
      const travel = (time * 0.65 + index / dotCount) % 1;
      const startX = 760 + ((index * 97) % 400);
      const target = targetFor(index);
      dot.style.left = `${lerp(startX, partitionCenterX(target), easeInOut(travel))}px`;
      dot.style.top = `${lerp(290, 600, easeInOut(travel))}px`;
      dot.style.opacity = strength * Math.sin(Math.PI * travel);
    });
  }

  return (time, at) => {
    reveal(root.querySelector("#key-card"), ramp(time, at("partition key") - 0.3, 0.5));
    servers.forEach((server, index) => reveal(server, ramp(time, at("partition key") + index * 0.12, 0.5)));
    const crowdedPhase = ramp(time, at("todays") - 0.2, 0.5);
    const spreadPhase = ramp(time, at("user") - 0.3, 0.7);
    const keyValue = root.querySelector("#key-value");
    keyValue.textContent = spreadPhase > 0.5 ? "user ID  (u-1842, u-0937, …)" : crowdedPhase > 0.5 ? "today's date  (2026-10-04)" : "?";
    keyValue.style.color = spreadPhase > 0.5 ? "var(--green)" : crowdedPhase > 0.5 ? "var(--red)" : "var(--gold)";

    moveDots(crowdedDots, time, crowdedPhase * (1 - spreadPhase) * ramp(time, at("lands") - 0.3, 0.5), () => 1);
    moveDots(spreadDots, time, spreadPhase, (index) => (index * 7) % 4);

    servers.forEach((server, index) => {
      const crowdedLoad = index === 1 ? 100 : 4;
      const spreadLoad = [27, 24, 26, 23][index];
      const load = lerp(lerp(2, crowdedLoad, ramp(time, at("lands"), 1.0)), spreadLoad, ramp(time, at("spreads"), 1.0));
      const fill = server.querySelector(".meter-fill");
      fill.style.width = `${load}%`;
      fill.style.background = load > 70 ? "var(--red)" : "var(--green)";
      server.querySelector(".load-value").textContent = `${Math.round(load)}%`;
      const isHot = index === 1 && load > 70;
      server.style.borderColor = isHot ? "var(--red)" : "var(--line)";
      server.style.boxShadow = isHot ? `0 0 ${50 + 20 * Math.sin(time * 6)}px rgba(255,107,129,0.45)` : "0 24px 60px rgba(0,0,0,0.35)";
      reveal(idleLabels[index], ramp(time, at("idle") - 0.2, 0.4) * (1 - spreadPhase), { rise: 8 });
    });
    reveal(root.querySelector("#hot-tag"), ramp(time, at("hot") - 0.2, 0.4) * (1 - spreadPhase), { rise: 10 });
    reveal(root.querySelector("#slow-tag"), ramp(time, at("slows") - 0.2, 0.4) * (1 - spreadPhase), { rise: 10 });
    reveal(root.querySelector("#even-tag"), ramp(time, at("evenly") - 0.3, 0.4), { rise: 10 });
  };
};

    </div>

  const growBars = (bars, time, start) => bars.forEach((bar, index) => { bar.style.height = `${bar.dataset.height * ramp(time, start + index * 0.04, 0.5)}%`; });

  return (time, at) => {

    growBars(onDemandBars, time, at("charges"));

    reveal(root.querySelector("#capacity-label"), ramp(time, at("reserve") + 0.2, 0.5), { rise: 6 });

};

SCENE_BUILDERS.recap = (root) => {

  return (time, at, scene) => {

      reveal(point, ramp(time, at(points[index][2]) - 0.3, 0.5), { rise: 20 });
      point.style.borderColor = time > at(points[index][2]) && (index === points.length - 1 || time < at(points[index + 1][2])) ? "var(--blue)" : "var(--line)";
    });

    reveal(root.querySelector("#end-card"), endProgress, { scaleFrom: 0.9 });

// ---------------------------------------------------------------------------
// Captions: the narration, a line at a time, with the current word highlighted.
// ---------------------------------------------------------------------------
function buildCaptionLines(words) {
  const lines = [];
  let currentLine = [];
  let currentLength = 0;
  const finishLine = () => { if (currentLine.length) lines.push(currentLine); currentLine = []; currentLength = 0; };
  words.forEach((word) => {
    if (currentLine.length && currentLength + word.display.length + 1 > 52) finishLine();
    currentLine.push(word);
    currentLength += word.display.length + 1;
    if (/[.?!:]$/.test(word.display) || (/[,;]$/.test(word.display) && currentLength > 30)) finishLine();
  });
  finishLine();
  return lines.map((lineWords) => ({ words: lineWords, start: lineWords[0].start, end: lineWords[lineWords.length - 1].end }));
}

// ---------------------------------------------------------------------------
// Assembly and the frame clock
// ---------------------------------------------------------------------------
const timeline = window.TIMELINE;
const scenesContainer = document.getElementById("scenes");
const captionsElement = document.getElementById("captions");
const progressElement = document.getElementById("progress");
document.getElementById("brand").innerHTML = `${databaseIcon(34)}<span>DynamoDB, explained</span>`;
window.RENDER_ERRORS = [];

const sceneRuntimes = timeline.scenes.map((scene, sceneIndex) => {
  const root = document.createElement("div");
  root.className = "scene";
  root.style.display = "block"; // visible while building so SVG paths can be measured
  scenesContainer.appendChild(root);
  const update = SCENE_BUILDERS[scene.id](root, scene);
  root.style.display = "none";
  const segment = document.createElement("div");
  segment.className = "progress-segment";
  segment.style.flexGrow = scene.duration;
  segment.innerHTML = `<div class="progress-fill"></div>`;
  progressElement.appendChild(segment);
  return { scene, sceneIndex, root, update, at: createCueFinder(scene), captionLines: buildCaptionLines(scene.words), progressFill: segment.firstChild };
});

let activeSceneIndex = -1;
let shownCaptionKey = "";

function renderFrame(globalTime) {
  const runtime = sceneRuntimes.find(({ scene }) => globalTime < scene.start + scene.duration) || sceneRuntimes[sceneRuntimes.length - 1];
  const { scene, root } = runtime;
  const localTime = globalTime - scene.start;
  if (runtime.sceneIndex !== activeSceneIndex) {
    sceneRuntimes.forEach((other) => { other.root.style.display = other === runtime ? "block" : "none"; });
    activeSceneIndex = runtime.sceneIndex;
    document.getElementById("scene-number").textContent = String(runtime.sceneIndex + 1).padStart(2, "0");
    document.getElementById("scene-title").textContent = scene.title;
  }
  // Cross-fade at scene edges (the first scene fades in from black, the last one holds).
  const isLastScene = runtime.sceneIndex === sceneRuntimes.length - 1;
  const fadeIn = ramp(localTime, 0, 0.4);
  const fadeOut = isLastScene ? 1 : 1 - ramp(localTime, scene.duration - 0.35, 0.35);
  root.style.opacity = Math.min(fadeIn, fadeOut);
  try {
    runtime.update(localTime, runtime.at, scene);
  } catch (error) {
    window.RENDER_ERRORS.push(`${scene.id} @ ${localTime.toFixed(2)}s: ${error.message}`);
  }

  sceneRuntimes.forEach((other) => {
    const sceneProgress = clamp01((globalTime - other.scene.start) / other.scene.duration);
    other.progressFill.style.transform = `scaleX(${sceneProgress})`;
  });
  const labelOpacity = runtime.sceneIndex === 0 ? 0 : 1;
  document.getElementById("scene-label").style.opacity = labelOpacity * Math.min(fadeIn, fadeOut);

  // Captions
  const lines = runtime.captionLines;
  let lineIndex = -1;
  lines.forEach((line, index) => { if (localTime >= line.start - 0.12) lineIndex = index; });
  const line = lines[lineIndex];
  const nextLine = lines[lineIndex + 1];
  const lineVisible = line && localTime <= Math.min(line.end + 0.7, nextLine ? nextLine.start - 0.12 : Infinity);
  const captionKey = lineVisible ? `${scene.id}:${lineIndex}` : "";
  if (captionKey !== shownCaptionKey) {
    captionsElement.innerHTML = lineVisible ? `<span class="caption-box">${line.words.map((word) => `<span class="word">${word.display}</span>`).join(" ")}</span>` : "";
    shownCaptionKey = captionKey;
  }
  if (lineVisible) {
    [...captionsElement.querySelectorAll(".word")].forEach((element, index) => {
      const word = line.words[index];
      element.className = `word${localTime >= word.start ? " spoken" : ""}${localTime >= word.start && localTime < word.end + 0.05 ? " current" : ""}`;
    });
  }
}

window.renderFrame = renderFrame;
window.VIDEO_DURATION = timeline.totalDuration;

// Check every cue once up front, so a typo in a cue word is caught before rendering.
sceneRuntimes.forEach((runtime) => { for (let time = 0; time < runtime.scene.duration; time += 0.5) renderFrame(runtime.scene.start + time); });
window.CUE_ERRORS = [...new Set(window.RENDER_ERRORS)];
window.RENDER_ERRORS = [];

// Preview mode: open video.html?preview in a browser to watch it with the voiceover.
if (new URLSearchParams(location.search).has("preview")) {
  const fitStage = () => { const scale = Math.min(innerWidth / 1920, innerHeight / 1080); document.getElementById("stage").style.transform = `scale(${scale})`; };
  addEventListener("resize", fitStage);
  fitStage();
  const voiceover = new Audio("build/voiceover.wav");
  const startTime = parseFloat(new URLSearchParams(location.search).get("t") || "0");
  const tick = () => { renderFrame(voiceover.currentTime); requestAnimationFrame(tick); };
  document.body.addEventListener("click", () => { voiceover.currentTime = startTime; voiceover.play(); tick(); }, { once: true });
  renderFrame(startTime);
} else {
  renderFrame(0);
}
</script>
